name: "Setup and Test"
description: "Sets up Node, pnpm, and Playwright, and runs quality gates and tests."

inputs:
  scope:
    description: "all, quality, or browser; Quality requires both scoped jobs"
    required: false
    default: "all"
  browser-shard:
    description: "Optional Playwright shard, for example 1/4"
    required: false
  browser-projects:
    description: "Comma-separated existing browser projects; empty selects all"
    required: false
  vite-audio-base-url:
    description: "VITE_AUDIO_BASE_URL environment variable"
    required: false

runs:
  using: "composite"
  steps:
    - name: Validate gate scope
      shell: bash
      env:
        GATE_SCOPE: ${{ inputs.scope }}
        BROWSER_SHARD: ${{ inputs.browser-shard }}
      run: |
        case "$GATE_SCOPE" in all|quality|browser) ;; *) exit 1 ;; esac
        if [ -n "$BROWSER_SHARD" ]; then
          [[ "$BROWSER_SHARD" =~ ^[1-9][0-9]*/[1-9][0-9]*$ ]]
        fi
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Verify pinned toolchain
      run: pnpm run verify:toolchain
      shell: bash

    - name: Verify quality gates
      if: inputs.scope != 'browser'
      run: pnpm check
      shell: bash
      env:
        VITE_AUDIO_BASE_URL: ${{ inputs.vite-audio-base-url }}

    - name: Verify every hosted audio recording
      if: inputs.scope != 'browser'
      run: pnpm validate:audio
      shell: bash
      env:
        VITE_AUDIO_BASE_URL: ${{ inputs.vite-audio-base-url }}

    - name: Resolve browser cache identity
      if: inputs.scope != 'quality'
      id: browser-runtime
      shell: bash
      env:
        BROWSER_PROJECTS: ${{ inputs.browser-projects }}
      run: |
        engines="$(node scripts/browser-engines.mjs "$BROWSER_PROJECTS")"
        echo "key=${engines// /-}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: inputs.scope != 'quality'
      uses: actions/cache@v6
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-v3-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.browser-runtime.outputs.key }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright browsers
      # Validate executables even on a cache hit; Playwright reuses complete downloads.
      if: inputs.scope != 'quality'
      run: |
        read -r -a engines <<< "$(node scripts/browser-engines.mjs "$BROWSER_PROJECTS")"
        pnpm exec playwright install --with-deps "${engines[@]}"
      shell: bash
      env:
        BROWSER_PROJECTS: ${{ inputs.browser-projects }}

    - name: Run E2E tests
      if: inputs.scope != 'quality'
      run: |
        if [ -n "$BROWSER_SHARD" ]; then
          project_args=()
          if [ -n "$BROWSER_PROJECTS" ]; then
            IFS=, read -r -a projects <<< "$BROWSER_PROJECTS"
            for project in "${projects[@]}"; do
              case "$project" in
                desktop-chromium|mobile-chromium|tablet-chromium|desktop-firefox-smoke|mobile-webkit-smoke) ;;
                *) exit 1 ;;
              esac
              project_args+=(--project="$project")
            done
          fi
          pnpm test:e2e --shard="$BROWSER_SHARD" "${project_args[@]}" --reporter=github,json,blob
        else
          pnpm test:e2e
        fi
      shell: bash
      env:
        BROWSER_SHARD: ${{ inputs.browser-shard }}
        BROWSER_PROJECTS: ${{ inputs.browser-projects }}
        PLAYWRIGHT_JSON_OUTPUT_FILE: output/e2e-results.json
        VITE_AUDIO_BASE_URL: ${{ inputs.vite-audio-base-url }}
