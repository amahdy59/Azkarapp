name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - "main"
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-worker"
  cancel-in-progress: false

jobs:
  deploy:
    # Without an explicit timeout this job inherits GitHub's 6-hour default,
    # so bound it and let a re-run recover instead.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Without Cloudflare credentials there is nothing to deploy to. Skip
    # instead of failing so setups without the secrets stay green; adding
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID enables the deploy.
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply azkarapp-production --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify Worker health
        run: |
          for attempt in $(seq 1 12); do
            body=$(curl -fsS https://azkarapp-api.amahdy59.workers.dev/v1/health || true)
            if [ "$body" = '{"ok":true}' ]; then
              echo "Worker health OK"
              exit 0
            fi
            echo "Attempt $attempt: unexpected response: $body"
            sleep 10
          done
          echo "Worker health check failed"
          exit 1
