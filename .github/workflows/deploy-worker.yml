name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - "main"
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-worker"
  cancel-in-progress: false

jobs:
  deploy:
    # Without an explicit timeout this job inherits GitHub's 6-hour default,
    # so bound it and let a re-run recover instead.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Without Cloudflare credentials there is nothing to deploy to. The guard
    # step records whether they exist; Cloudflare steps run only then, so
    # setups without the secrets stay green. Adding CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID enables the deploy. (The `secrets` context is
    # not available in `if` conditions, so the guard communicates through a
    # step output instead. The secret value itself is never printed.)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials not set; Worker deploy steps will skip."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present; deploy will run."
          fi

      - name: Apply D1 migrations
        if: steps.guard.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply azkarapp-production --remote

      - name: Deploy Worker
        if: steps.guard.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify Worker health
        if: steps.guard.outputs.enabled == 'true'
        run: |
          for attempt in $(seq 1 12); do
            body=$(curl -fsS https://azkarapp-api.amahdy59.workers.dev/v1/health || true)
            if [ "$body" = '{"ok":true}' ]; then
              echo "Worker health OK"
              exit 0
            fi
            echo "Attempt $attempt: unexpected response: $body"
            sleep 10
          done
          echo "Worker health check failed"
          exit 1
