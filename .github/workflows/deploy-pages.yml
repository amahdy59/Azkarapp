name: Deploy GitHub Pages

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "AGENTS.md"
      - "README.md"
      - "README_FIRST.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify quality gates
        run: pnpm check
        env:
          VITE_AUDIO_BASE_URL: ${{ vars.VITE_AUDIO_BASE_URL }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system deps only (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Build app for GitHub Pages
        run: pnpm build:pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: https://amahdy59.github.io/Azkarapp/
          VITE_TERMS_URL: https://amahdy59.github.io/Azkarapp/terms.html
          VITE_PRIVACY_URL: https://amahdy59.github.io/Azkarapp/privacy.html
          VITE_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}
          VITE_EMAIL_AUTH_ENABLED: ${{ vars.VITE_EMAIL_AUTH_ENABLED }}
          VITE_APPLE_AUTH_ENABLED: ${{ vars.VITE_APPLE_AUTH_ENABLED }}
          VITE_AUDIO_BASE_URL: ${{ vars.VITE_AUDIO_BASE_URL }}

      - name: Generate deployment metadata
        run: |
          node -e "
          const fs = require('fs');
          const meta = {
            sha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            builtAt: new Date().toISOString()
          };
          fs.writeFileSync('./dist/deployment-meta.json', JSON.stringify(meta, null, 2));
          console.log('Generated deployment-meta.json:', meta);
          "
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000

  verify-production:
    timeout-minutes: 10
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify production deployment
        run: |
          node -e "
          const http = require('http');
          const https = require('https');

          const baseUrl = '${{ needs.deploy.outputs.page_url }}'.replace(/\/$/, '') + '/';
          const metaUrl = baseUrl + 'deployment-meta.json?cb=' + Date.now();
          const expectedSha = '${{ github.sha }}';

          function fetchUrl(url, headers = {}) {
            return new Promise((resolve, reject) => {
              const client = url.startsWith('https') ? https : http;
              client.get(url, { headers: { 'Cache-Control': 'no-cache', ...headers } }, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => resolve({ statusCode: res.statusCode, data, headers: res.headers }));
              }).on('error', reject);
            });
          }

          async function verify() {
            const maxAttempts = 12;
            const delayMs = 10000;

            console.log('Starting production smoke test for:', baseUrl);
            console.log('Expected commit SHA:', expectedSha);

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              console.log(\`Attempt \${attempt}/\${maxAttempts}...\`);
              try {
                // 1. Verify main page returns 200 and root element
                const mainRes = await fetchUrl(baseUrl);
                if (mainRes.statusCode !== 200) {
                  console.log(\`Main page status \${mainRes.statusCode}, retrying...\`);
                  await new Promise(r => setTimeout(r, delayMs));
                  continue;
                }

                if (!mainRes.data.includes('id=\"root\"') && !mainRes.data.includes('id=\'root\'')) {
                  console.log('Main page HTML missing root element, retrying...');
                  await new Promise(r => setTimeout(r, delayMs));
                  continue;
                }

                // 2. Verify metadata json
                const metaRes = await fetchUrl(metaUrl);
                if (metaRes.statusCode !== 200) {
                  console.log(\`Metadata status \${metaRes.statusCode}, retrying...\`);
                  await new Promise(r => setTimeout(r, delayMs));
                  continue;
                }

                const meta = JSON.parse(metaRes.data);
                console.log('Fetched production metadata:', meta);

                if (meta.sha !== expectedSha) {
                  console.log(\`Metadata SHA mismatch! Expected \${expectedSha}, got \${meta.sha}. Retrying...\`);
                  await new Promise(r => setTimeout(r, delayMs));
                  continue;
                }

                console.log('SUCCESS: Production deployment verified successfully!');
                process.exit(0);
              } catch (err) {
                console.log('Error during attempt:', err.message);
                await new Promise(r => setTimeout(r, delayMs));
              }
            }

            console.error('FAILED: Production verification timed out after', maxAttempts, 'attempts.');
            process.exit(1);
          }

          verify();
          "
