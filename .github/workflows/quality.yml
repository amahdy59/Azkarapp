name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup and Test
        uses: ./.github/actions/setup-and-test
        with:
          vite-audio-base-url: ${{ vars.VITE_AUDIO_BASE_URL }}
