name: Quality

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "AGENTS.md"
      - "README.md"
      - "README_FIRST.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Setup and Test
        uses: ./.github/actions/setup-and-test
        with:
          vite-audio-base-url: ${{ vars.VITE_AUDIO_BASE_URL }}

      - name: Verify GitHub Pages build
        run: pnpm build:pages
        env:
          VITE_AUDIO_BASE_URL: ${{ vars.VITE_AUDIO_BASE_URL }}

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Preserve browser failure evidence
        # A successful retry must not discard the failed attempt's trace.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve browser timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-timings
          path: output/e2e-results.json
          if-no-files-found: ignore
          retention-days: 7
