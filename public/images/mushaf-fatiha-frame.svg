<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" preserveAspectRatio="none" style="width:100%;height:100%;display:block;">
  <defs>
    <clipPath id="rect-page-clip">
      <rect width="1200" height="1800" rx="16" />
    </clipPath>
  </defs>
  <g clip-path="url(#rect-page-clip)">
    <!-- Outer Background Canvas -->
    <rect width="1200" height="1800" fill="var(--background, #0b1120)" />

    <!-- 1st Outer Border (Subtle secondary border) -->
    <rect x="35" y="35" width="1130" height="1730" rx="12" fill="none" stroke="var(--secondary, #388386)" stroke-width="2" opacity="0.45" />

    <!-- 2nd Main Outer Gilded Stroke (Primary Gold) -->
    <rect x="55" y="55" width="1090" height="1690" rx="10" fill="none" stroke="var(--accent, #d4b47c)" stroke-width="6" stroke-linejoin="round" />

    <!-- 3rd Intermediate Ornamental Stroke (Dashed Teal/Secondary) -->
    <rect x="74" y="74" width="1052" height="1652" rx="8" fill="none" stroke="var(--secondary, #388386)" stroke-width="2.5" stroke-dasharray="8,5" opacity="0.85" />

    <!-- 4th Inner Gilded Stroke with Card Surface Fill -->
    <rect x="92" y="92" width="1016" height="1616" rx="6" fill="var(--card, #141c2e)" stroke="var(--accent, #d4b47c)" stroke-width="3" />

    <!-- 4 Decorative Manuscript Corner Rosettes/Brackets -->
    
    <g transform="translate(95, 95) rotate(0)">
      <path d="M 0,0 L 45,0 C 35,15 35,35 0,45 Z" fill="var(--accent, #d4b47c)" opacity="0.35" />
      <path d="M 0,0 L 40,0 C 30,12 30,30 0,40 Z" fill="none" stroke="var(--accent, #d4b47c)" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4" fill="var(--accent, #d4b47c)" />
    </g>
  
    
    <g transform="translate(1105, 95) rotate(90)">
      <path d="M 0,0 L 45,0 C 35,15 35,35 0,45 Z" fill="var(--accent, #d4b47c)" opacity="0.35" />
      <path d="M 0,0 L 40,0 C 30,12 30,30 0,40 Z" fill="none" stroke="var(--accent, #d4b47c)" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4" fill="var(--accent, #d4b47c)" />
    </g>
  
    
    <g transform="translate(1105, 1705) rotate(180)">
      <path d="M 0,0 L 45,0 C 35,15 35,35 0,45 Z" fill="var(--accent, #d4b47c)" opacity="0.35" />
      <path d="M 0,0 L 40,0 C 30,12 30,30 0,40 Z" fill="none" stroke="var(--accent, #d4b47c)" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4" fill="var(--accent, #d4b47c)" />
    </g>
  
    
    <g transform="translate(95, 1705) rotate(270)">
      <path d="M 0,0 L 45,0 C 35,15 35,35 0,45 Z" fill="var(--accent, #d4b47c)" opacity="0.35" />
      <path d="M 0,0 L 40,0 C 30,12 30,30 0,40 Z" fill="none" stroke="var(--accent, #d4b47c)" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4" fill="var(--accent, #d4b47c)" />
    </g>
  
  </g>
</svg>